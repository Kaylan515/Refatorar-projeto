<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo — Estoque SENAI AAPM</title>
    <style>
        /* =========================================================
           ESTILO INSTITUCIONAL - SENAI / AAPM
           Cores: Vermelho (#C8102E / #9B0014), Preto (#121212 / #1E1E1E),
                  Cinza (#F4F5F7 / #E0E0E0), Branco (#FFFFFF)
           ========================================================= */

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container do Cartão / Boas-vindas */
        .welcome-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #c8102e; /* Faixa Vermelha SENAI */
            text-align: center;
        }

        /* Marca / Sigla AAPM */
        .brand-badge {
            display: inline-block;
            background-color: #121212;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Títulos */
        h1 {
            color: #121212;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: #555555;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Grupo de Botões */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Botão Principal (Entrar) */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background-color: #c8102e;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #9b0014;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        /* Botão Secundário (Criar Conta) */
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background-color: transparent;
            color: #121212;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 6px;
            border: 2px solid #121212;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #121212;
            color: #ffffff;
        }

        .btn-secondary:active {
            transform: scale(0.99);
        }

        /* Rodapé do card */
        .card-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.75rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <main class="welcome-container">
        <span class="brand-badge">AAPM • SENAI</span>
        <h1>Sistema de Estoque</h1>
        <p>Faça login para acessar o sistema.</p>

        <div class="button-group">
            <a href="/auth/login" class="btn-primary">Entrar</a>
            <a href="/auth/register" class="btn-secondary">Criar conta</a>
        </div>

        <div class="card-footer">
            Associação de Pais e Mestres
        </div>
    </main>

</body>
</html>
