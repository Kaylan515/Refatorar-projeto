<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} — AAPM SENAI</title>
    {% include "_aapm_styles.html" %}
    <style>
        body { display: grid; place-items: center; }
        .error-card { width: min(100%, 620px); padding: clamp(2rem, 7vw, 4.5rem); text-align: center; background: #211b1a; border: 1px solid #443633; border-radius: 1.25rem; box-shadow: 0 25px 60px rgba(0,0,0,.3); }
        .error-code { color: #ff4b5f; font: 800 clamp(4rem, 14vw, 8rem)/1 'Space Grotesk', sans-serif; letter-spacing: -.08em; }
        .error-card h1 { margin: .8rem 0; }
        .error-card p { max-width: 42ch; margin: 0 auto 1.5rem; }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="error-code">{{ codigo }}</div>
        <h1>{{ titulo }}</h1>
        <p>{{ mensagem }}</p>
        <a href="/">Voltar ao painel</a>
    </main>
</body>
</html>
