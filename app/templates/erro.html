<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} — AAPM SENAI</title>
    {% include "_aapm_styles.html" %}
    <link rel="stylesheet" href="/static/css/erro.css">
</head>

<body>
    <div class="spotlight" id="spotlight"></div>

    <div class="page-wrapper error-wrapper">
        <header class="site-header">
            <div class="nav-brand">
                <strong>SENAI</strong>
                <span class="divider">•</span>
                <span>Educação profissional • Tecnologia</span>
            </div>
            <span class="brand-badge">AAPM • SENAI</span>
        </header>

        <main class="error-section">
            <div class="error-code-badge">{{ codigo }}</div>
            <div class="error-copy">
                <h1>{{ titulo }}</h1>
                <p>{{ mensagem }}</p>
            </div>

            <div class="button-group">
                <a href="/" class="btn-primary">Voltar ao painel</a>
            </div>
        </main>

        <footer class="welcome-footer">
            <div class="footer-info">
                <p><strong>Associação de Pais e Mestres</strong> • SENAI</p>
                <p class="footer-sub">Plataforma interna de gestão acadêmica e operacional.</p>
            </div>
            <div class="footer-links">
                <span>Suporte T.I.</span>
                <span>•</span>
                <span>Termos de Uso</span>
            </div>
        </footer>
    </div>

    <script src="/static/js/ui.js" defer></script>
    <script src="/static/js/welcome.js"></script>
</body>

</html>
