<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap');

    :root {
        --aapm-red: #c8102e;
        --aapm-red-dark: #94001d;
        --aapm-ink: #18181b;
        --aapm-paper: #ffffff;
        --aapm-canvas: #f5f5f4;
        --aapm-line: #e7e5e4;
        --aapm-muted: #78716c;
        --aapm-green: #15803d;
        --aapm-amber: #b45309;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--aapm-canvas); }
    body {
        max-width: 1280px;
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1.5rem, 4vw, 3.5rem);
        font-family: 'DM Sans', Arial, sans-serif;
        color: var(--aapm-ink);
        line-height: 1.5;
        background: linear-gradient(135deg, #fafaf9 0%, #f5f5f4 58%, #f0e8e7 100%);
        border-top: 6px solid var(--aapm-red);
    }
    body::before {
        content: 'AAPM  •  SENAI';
        display: block;
        margin-bottom: .6rem;
        color: var(--aapm-red);
        font: 800 .72rem/1 'Syne', sans-serif;
        letter-spacing: .16em;
    }
    h1, h2, h3 { font-family: 'Syne', Arial, sans-serif; letter-spacing: -.035em; }
    h1 { margin: 0 0 1.75rem; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; }
    h2 { margin-top: 2rem; }
    h3 { margin: 1.5rem 0 .75rem; }
    p { color: #57534e; }
    a { color: var(--aapm-red); font-weight: 700; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
    a:hover { color: var(--aapm-red-dark); }
    body > a, form + a, p > a:first-child, .actions a {
        display: inline-flex; align-items: center; gap: .4rem; margin: .65rem .35rem .65rem 0;
        padding: .7rem 1rem; border: 1px solid #d6d3d1; border-radius: .55rem;
        background: var(--aapm-paper); text-decoration: none;
        box-shadow: 0 1px 2px rgba(24,24,27,.05); transition: .2s ease;
    }
    body > a:hover, form + a:hover, p > a:first-child:hover { border-color: var(--aapm-red); transform: translateY(-1px); }
    form {
        display: flex; flex-wrap: wrap; align-items: end; gap: 1rem;
        max-width: 800px; margin: 1.25rem 0 1.5rem; padding: 1.35rem;
        background: var(--aapm-paper); border: 1px solid var(--aapm-line); border-radius: .9rem;
        box-shadow: 0 10px 24px rgba(41,37,36,.06);
    }
    label { display: grid; gap: .42rem; flex: 1 1 205px; color: #44403c; font-size: .88rem; font-weight: 700; }
    label:has(input[type='checkbox']) { display: flex; align-items: center; gap: .55rem; padding: .75rem 0; }
    form br { display: none; }
    input, select, textarea {
        width: 100%; min-height: 2.8rem; padding: .68rem .78rem; border: 1px solid #d6d3d1;
        border-radius: .5rem; background: #fff; color: var(--aapm-ink); font: inherit;
        transition: border-color .18s, box-shadow .18s;
    }
    input[type='checkbox'] { width: 1rem; min-height: auto; accent-color: var(--aapm-red); }
    input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--aapm-red); box-shadow: 0 0 0 3px rgba(200,16,46,.13); }
    button, input[type='submit'] {
        min-height: 2.8rem; padding: .7rem 1.05rem; border: 0; border-radius: .5rem;
        background: var(--aapm-red); color: #fff; font: 700 .9rem 'DM Sans', sans-serif; cursor: pointer;
        box-shadow: 0 3px 8px rgba(148,0,29,.18); transition: transform .18s, background .18s;
    }
    button:hover, input[type='submit']:hover { background: var(--aapm-red-dark); transform: translateY(-1px); }
    form[style*='display:inline'] { display: inline-flex !important; margin: 0; padding: 0; background: transparent; border: 0; box-shadow: none; vertical-align: middle; }
    form[style*='display:inline'] button { min-height: 2.1rem; padding: .42rem .7rem; font-size: .78rem; }
    table { width: 100%; margin: 1.4rem 0; overflow: hidden; border: 1px solid var(--aapm-line); border-collapse: separate; border-spacing: 0; border-radius: .9rem; background: var(--aapm-paper); box-shadow: 0 10px 24px rgba(41,37,36,.06); }
    th, td { padding: .9rem 1rem; border: 0; border-bottom: 1px solid #f0eeec; text-align: left; vertical-align: middle; }
    th { background: #292524; color: #fff; font: 700 .73rem 'Syne', sans-serif; letter-spacing: .07em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fff8f8; }
    td img { border-radius: .45rem; border: 1px solid var(--aapm-line); }
    hr { border: 0; border-top: 1px solid var(--aapm-line); margin: 2rem 0; }
    ul { padding-left: 1.25rem; }
    p[style*='color:green'], p[style*='color: green'] { padding: .8rem 1rem; color: #166534 !important; background: #f0fdf4; border-left: 4px solid #22c55e; border-radius: .35rem; }
    p[style*='color:red'], p[style*='color: red'] { padding: .8rem 1rem; color: #991b1b !important; background: #fef2f2; border-left: 4px solid var(--aapm-red); border-radius: .35rem; }
    @media (max-width: 680px) {
        body { padding: 1.25rem; }
        h1 { font-size: 2rem; }
        form { padding: 1rem; }
        table { display: block; overflow-x: auto; white-space: nowrap; }
    }
</style>
