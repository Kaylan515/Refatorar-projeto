<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
    :root {
        --bg-color: #0c0a09;
        --card-bg: rgba(24, 20, 18, 0.5);
        --border-color: rgba(68, 54, 51, 0.4);
        --border-hover: rgba(217, 119, 6, 0.45);
        --text-main: #f5f5f4;
        --text-muted: #a8a29e;
        --primary-color: #d97706;
        --primary-hover: #b45309;
        --accent-glow: rgba(217, 119, 6, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    /* Grade de fundo contínua (Estilo SaaS Webflow) */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 56px 56px;
        z-index: 0;
        pointer-events: none;
    }

    /* Efeito de Spotlight do Mouse */
    .spotlight {
        position: fixed;
        top: 0;
        left: 0;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(217, 119, 6, 0.07) 0%, rgba(0,0,0,0) 70%);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 1;
        transition: width 0.3s, height 0.3s;
    }

    .page-wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 2rem 4rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 3.5rem;
        min-height: 100vh;
        justify-content: space-between;
    }

    .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-color);
    }

    .nav-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .nav-brand strong {
        color: var(--text-main);
        letter-spacing: 1.2px;
        font-size: 1.1rem;
    }

    .divider {
        color: var(--primary-color);
    }

    .brand-badge {
        display: inline-block;
        padding: 0.3rem 0.85rem;
        background: rgba(217, 119, 6, 0.1);
        border: 1px solid rgba(217, 119, 6, 0.3);
        color: var(--primary-color);
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 50px;
        letter-spacing: 0.8px;
    }

    .btn-primary {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        background-color: var(--primary-color);
        color: #ffffff;
        padding: 0.9rem 2.5rem;
        border-radius: 14px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.25s ease;
        box-shadow: 0 4px 20px rgba(217, 119, 6, 0.35);
    }

    .btn-primary:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(217, 119, 6, 0.45);
    }

    .welcome-footer {
        border-top: 1px solid var(--border-color);
        padding-top: 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    .footer-info {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
    }

    .footer-info strong {
        color: var(--text-main);
    }

    .footer-sub {
        font-size: 0.75rem;
    }

    .footer-links {
        display: flex;
        gap: 1rem;
        align-items: center;
    }
</style>
<link rel="stylesheet" href="/static/css/_aapm_styles.css">
<link rel="stylesheet" href="/static/css/app-shell.css">
