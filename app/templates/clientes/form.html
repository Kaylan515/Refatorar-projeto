<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{{ "Editar" if editando else "Novo" }} Cliente — AAPM SENAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/clientes/form.css">
    <script src="/static/js/clientes/form.js" defer></script>
</head>

<body>
    <div class="form-container">
        <header class="form-header">
            <h1>👤 {{ "Editar cliente" if editando else "Novo cliente" }}</h1>
            <p>Preencha os dados do cliente para registo no sistema</p>
        </header>

        {% if erro %}
        <div class="alerta">{{ erro }}</div>
        {% endif %}

        {% if request.query_params.get('erro') == 'matricula' %}
        <div class="alerta">Esta matrícula já está em uso.</div>
        {% endif %}

        <form action="{{ '/clientes/' + editando.id|string + '/editar' if editando else '/clientes/novo' }}" method="post" class="cliente-form">

            <div class="input-group">
                <label for="input-nome">Nome completo</label>
                <input type="text" name="nome" required autofocus id="input-nome" class="form-control"
                    value="{{ editando.nome if editando else (valores.nome if valores else '') }}" placeholder="Ex: João da Silva">
            </div>

            <div class="input-group">
                <label for="input-matricula">Matrícula SENAI (opcional)</label>
                <input type="text" name="matricula" id="input-matricula" class="form-control" placeholder="Ex: 2024001"
                    value="{{ editando.matricula if editando else (valores.matricula if valores else '') }}">
            </div>

            <div class="input-group">
                <label for="input-telefone">Telefone (opcional)</label>
                <input type="text" name="telefone" id="input-telefone" class="form-control" placeholder="Ex: (11) 99999-9999"
                    value="{{ editando.telefone if editando else (valores.telefone if valores else '') }}">
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_associado" value="true" {{ 'checked' if (editando and editando.is_associado) or (valores and valores.is_associado) }}>
                    <span>É associado AAPM (recebe 10% de desconto)</span>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    {{ "Salvar alterações" if editando else "Cadastrar cliente" }}
                </button>
                <a href="/clientes" class="btn-cancel">Cancelar</a>
            </div>

        </form>
    </div>
</body>

</html>
